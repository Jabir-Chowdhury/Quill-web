<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>This is my table</h1>
    <table>
        <thead>
            <tr>
              <th>Event</th>
              <th>Fight</th>
              <th>Venue</th>
              <th>City</th>
              <th>PPV</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>UFC 189</td>
                <td>Mendes vs.McGregor</td>
                <td rowspan="3">MGM Grand</td>
                <td rowspan="4">Las Vegas</td>
                <td>825,000</td>

            </tr>
            <tr>
                <td>UFC 198</td>
                <td>Aldo vs. Mcgregor</td>
                
                
                <td>1,200,00</td>

            </tr>
            <tr>
                <td>UFC 196</td>
                <td>Mc Gregor vs. Diaz</td>
                
               
                <td>1,65,000</td>

            </tr>
            <tr><td>UFC 202</td>
                <td>Diaz vs. McGregor</td>
                <td>T- Mobile</td>
               
                <td>1,317,000</td>

            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Total Sales</td>
                <td>4,992,000</td>

            </tr>
        </tfoot>
    </table>
    
</body>
</html>
